# Build master and publish it to the root of the gh-pages branch, which
# GitHub Pages serves (Settings > Pages > Deploy from a branch > gh-pages).
name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: .github/scripts/setup.sh

      # Keep Jekyll's cache, where compiled figures live, between runs.
      - uses: actions/cache@v4
        with:
          path: .jekyll-cache
          key: jekyll-cache-${{ github.sha }}
          restore-keys: jekyll-cache-

      - run: .github/scripts/build.sh

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          # Leave PR previews alone, and rebase instead of force-pushing so
          # concurrent preview deploys aren't clobbered.
          clean-exclude: pr-preview/
          force: false
