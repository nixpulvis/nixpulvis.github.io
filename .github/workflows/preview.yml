# Publish each pull request to https://nixpulvis.com/pr-preview/pr-<number>/
# and remove it again when the pull request is closed.
name: Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: .github/scripts/setup.sh
        if: github.event.action != 'closed'

      # Rust for the generator, and the terminal view in tui/ built to
      # WebAssembly.
      - uses: dtolnay/rust-toolchain@stable
        if: github.event.action != 'closed'
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        if: github.event.action != 'closed'

      # wasm-bindgen's CLI has to match the library version in Cargo.lock.
      - id: wasm-bindgen
        if: github.event.action != 'closed'
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        if: github.event.action != 'closed'
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      # Keep compiled TikZ figures between runs.
      - uses: actions/cache@v4
        if: github.event.action != 'closed'
        with:
          path: .site-cache
          key: site-cache-${{ github.sha }}
          restore-keys: site-cache-

      - run: .github/scripts/build.sh --unpublished --baseurl "/pr-preview/pr-${{ github.event.number }}"
        if: github.event.action != 'closed'

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: nixpulvis.com
