# Check the terminal view's crates, and build the terminal client for Linux
# and macOS, on x86 and ARM, whenever they change. Builds of master replace
# the `tui` release, so the download links in the README always get the
# latest client. Pull requests only check and build.
name: TUI

on:
  push:
    branches:
      - master
    paths:
      - tui/**
      - src/**
      - cratesite/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/tui.yml
  pull_request:
    paths:
      - tui/**
      - src/**
      - cratesite/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/tui.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency: tui-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The site generator, and the app with every feature.
      - run: cargo test --locked -p nixpulvis --features site,syntax,native-links
      - run: cargo clippy --locked -p nixpulvis --all-targets --features site,syntax,native-links -- -D warnings
      # cratesite with and without kramdown.
      - run: cargo test --locked -p cratesite --all-features
      - run: cargo clippy --locked -p cratesite --all-targets --all-features -- -D warnings
      - run: cargo test --locked -p cratesite --features generate
      - run: cargo clippy --locked -p cratesite --all-targets --features generate -- -D warnings
      # The browser view only builds for WebAssembly.
      - run: cargo clippy --locked -p nixpulvis-web --target wasm32-unknown-unknown -- -D warnings

  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # The macOS runners are ARM, and build for Intel Macs too.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --locked -p nixpulvis-tui --target ${{ matrix.target }}

      - run: tar -czf nixpulvis-tui-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release nixpulvis-tui

      - uses: actions/upload-artifact@v4
        with:
          name: nixpulvis-tui-${{ matrix.target }}
          path: nixpulvis-tui-${{ matrix.target }}.tar.gz

  release:
    if: github.ref == 'refs/heads/master'
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # Recreate the release so its tag moves to this commit.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete tui --cleanup-tag --yes || true
          gh release create tui nixpulvis-tui-*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "Terminal client" \
            --notes "The terminal client for nixpulvis.com, built from $GITHUB_SHA. See the README to install it."
