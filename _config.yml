title: nixpulvis
url: https://nixpulvis.com
repository: https://github.com/nixpulvis/nixpulvis.github.io
description: Projects, ramblings and notes by Nathan Lilienthal.

collections:
    mathematics:
        output: true
        permalink: /math/:name
    musings:
        output: true
        permalink: /:collection/:name
    projects:
        output: true
        permalink: /:collection/:name
    ramblings:
        output: true
        permalink: /:collection/:name
    research:
        output: true
        permalink: /:collection/:name

tikz:
  preamble: |
    \usepackage{tikz-cd}
    \usetikzlibrary{arrows.meta,graphs,positioning,automata}

# The terminal view, built into _site/tui by `make tui`. Keeping it means
# `jekyll serve` doesn't delete it when it rebuilds.
keep_files:
  - .git
  - .svn
  - tui

exclude:
  - Makefile
  - README.md
  - TODO-espresso
  - bin/
  - Cargo.lock
  - Cargo.toml
  - target/
  - tui/
