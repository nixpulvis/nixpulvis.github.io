# Reference tags on a scale, from the deepest computer science (red) to the
# most general topics (green). Each step down the scale shifts the color
# toward green, and the tags in a step share a color. Within a step, broader
# tags come before narrower ones. Topics that don't belong on the scale go
# in `groups`, each with its own color. A tag not listed here is gray. Tags
# are listed in this order at the top of the References page.

scale:
  - [pl, functional, contracts]
  - [foundations, racket, rust]
  - [bare-metal, avr]
  - [unix, processes]
  - [terminal, unicode]
groups:
  math: [math]
  hardware: [electronics]
