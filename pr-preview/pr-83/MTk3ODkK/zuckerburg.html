    <script>
      // A link ending in `?tui` turns the terminal view on, like the $ does.
      // Then hide the page straight away when it's on, rather than flash it
      // before js/tui.js takes over.
      try {
        const url = new URL(location.href);
        if (url.searchParams.has("tui")) {
          localStorage.setItem("tui", "on");
          url.searchParams.delete("tui");
          history.replaceState(history.state, "", url);
        }
        if (localStorage.getItem("tui")) document.documentElement.classList.add("tui");
      } catch (e) {}
    </script>
