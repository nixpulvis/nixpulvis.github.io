[package]
name = "nixpulvis"
version = "0.1.0"
description = "Browse nixpulvis.com in a terminal, shared by the native and web views"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Cell extensions, for real links, like OSC 8 in a terminal.
ratatui = { workspace = true, features = ["std", "cell-extensions"] }
ratmark = { workspace = true, features = ["links"] }
serde.workspace = true
serde_json.workspace = true
web-time = "1"

[features]
# Color code blocks. Worth it in a terminal, but it adds a couple of
# megabytes of syntax definitions to the web build.
syntax = ["ratmark/syntax"]
