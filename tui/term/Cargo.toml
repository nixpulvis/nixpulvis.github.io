[package]
name = "nixpulvis-tui"
version = "0.1.0"
description = "Read nixpulvis.com in your terminal"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nixpulvis = { path = "../app", features = ["syntax"] }
ratatui = { workspace = true, features = ["crossterm", "cell-extensions"] }
ureq = "3"
open = "5"

# Waiting on the terminal's answers to the color questions. Already under
# crossterm.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["event", "std"] }
