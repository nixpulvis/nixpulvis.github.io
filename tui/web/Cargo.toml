[package]
name = "nixpulvis-web"
version = "0.1.0"
description = "The terminal view of nixpulvis.com, in the browser"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
nixpulvis = { path = "../app", features = ["syntax"] }
ratmark = { workspace = true, features = ["web"] }
ratzilla = { version = "0.3", features = ["hyperlinks"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "CssStyleDeclaration",
  "Document",
  "Element",
  "History",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "Response",
  "Storage",
  "Window",
] }
